# KOOS standalone 실행 설정.
# koos-launch.sh 가 이 파일을 source 한다. 설치 후에는 /etc/koos/koos.conf 가 사용된다.
# 값 변경 후 재실행하면 즉시 반영된다. (앱 재빌드 불필요)

# Chrome 실행 파일. RPM 설치 시 google-chrome-stable 이 PATH 에 들어온다.
KOOS_CHROME_BIN="google-chrome-stable"

# 로드할 index.html 경로(file://). install.sh 는 /opt/koos/dist 에 배치한다.
# KOOS_HOME 이 설정돼 있으면 그 하위 dist/index.html 을 사용(런처가 기본값 계산).
# KOOS_INDEX="/opt/koos/dist/index.html"

# Chrome 전용 프로필 디렉터리. 사용자의 일반 Chrome 프로필과 분리해 앱처럼 동작시킨다.
# --disable-web-security 는 별도 user-data-dir 가 있어야 적용된다.
KOOS_PROFILE_DIR="$HOME/.config/koos/chrome-profile"

# ── Chrome / GPU 플래그 ───────────────────────────────────────────────
# 공백으로 구분한 한 줄. 환경(가상 GPU/드라이버)에 맞춰 자유롭게 편집한다.
#
#   --app=...                     : 런처가 file:// index 경로로 자동 주입 (여기 넣지 말 것)
#   --user-data-dir=...           : 런처가 KOOS_PROFILE_DIR 로 자동 주입 (여기 넣지 말 것)
#
#   --allow-file-access-from-files: file:// 에서 ES module import/fetch 허용 (필수).
#                                   Electron 은 기본 허용이라 불필요했지만 plain Chrome 은 필요.
#   --disable-web-security        : 타일 서버 cross-origin 요청 허용.
#                                   Electron main.ts 가 응답에 ACAO:* 를 주입했던 것과 동일 효과.
#   --no-sandbox                  : sandbox 미설정 환경/루트 실행 대응 (run-electron.sh 와 동일).
#   --ozone-platform=x11          : Wayland 백엔드 세그폴트 회피 → X11(XWayland) 강제.
#   --ignore-gpu-blocklist        : 가상 GPU(SVGA3D)가 blocklist 에 걸려 SW 렌더로 떨어지는 것 방지.
KOOS_CHROME_FLAGS="--allow-file-access-from-files --disable-web-security --no-sandbox --ozone-platform=x11 --ignore-gpu-blocklist"

# ── Vulkan 사용(선택) ─────────────────────────────────────────────────
# 동봉된 vulkan 런타임으로 ANGLE 의 Vulkan 백엔드를 쓰고 싶을 때 위 KOOS_CHROME_FLAGS 끝에
# 아래를 덧붙인다. 가상 GPU 에서는 오히려 렌더가 깨질 수 있어 기본 비활성. 환경에서 검증 후 사용.
#
#   --use-angle=vulkan --enable-features=Vulkan
