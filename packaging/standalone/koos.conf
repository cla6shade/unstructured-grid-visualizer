# KOOS 실행 설정. 이 파일(번들 폴더 안)을 편집하고 ./koos-launch.sh 를 다시 실행하면 반영된다.
#
# Chrome 실행 플래그 (공백으로 구분한 한 줄). 환경(가상 GPU/드라이버)에 맞게 편집한다.
#   --allow-file-access-from-files : file:// 에서 ES module/fetch 허용 (필수)
#   --disable-web-security         : 타일 서버 cross-origin 허용 (필수)
#   --test-type                    : "지원되지 않는 플래그" 경고 인포바 숨김
#   --disable-background-networking: 업데이트/구성요소 백그라운드 체크 끔 (업데이트 알림 방지)
#   --check-for-update-interval=…  : 업데이트 확인 주기를 사실상 무한대(1년)로
#   --ozone-platform=x11           : Wayland 크래시 회피 → X11
#   --ignore-gpu-blocklist         : 가상 GPU 가 SW 렌더로 떨어지는 것 방지
#   (동봉 vulkan 쓰려면 끝에  --use-angle=vulkan --enable-features=Vulkan  추가)
KOOS_CHROME_FLAGS="--allow-file-access-from-files --disable-web-security --test-type --disable-background-networking --check-for-update-interval=31536000 --ozone-platform=x11 --ignore-gpu-blocklist"

# 창 해상도 (가로x세로). 기본 1280x720.
KOOS_WINDOW_SIZE="1280x720"
